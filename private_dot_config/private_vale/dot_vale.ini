# Vale force-merges this XDG config into every run, including runs inside a
# project that has its own .vale.ini. That is the only reason this file
# exists: a project config declares sections like [*.md], and any buffer
# matching no section gets zero checks, which silenced prose linting on git
# commit messages (.git/COMMIT_EDITMSG lives inside the repo). The sections
# below put those buffers back in scope from anywhere.
#
# Deliberately no [*] section. A [*] here would populate GBaseStyles, which
# flips vale to linting every file it walks, so `vale content` in a repo
# with images would grind on multi-MB binaries as if they were prose. Naming
# only specific patterns keeps unmatched files skipped.
#
# Packages and StylesPath live in ~/.vale.ini, which vale finds by its normal
# upward search when no project config exists. A style named here that is
# missing from the active StylesPath is silently ignored rather than an
# error, so this stays safe in projects that sync a different package set.
MinAlertLevel = suggestion

[{*COMMIT_EDITMSG,*MERGE_MSG,*TAG_EDITMSG,*.jjdescription,*.eml,*.email}]
BasedOnStyles = write-good, proselint, alex
# E-Prime flags every form of "to be", which is far too noisy for general prose.
write-good.E-Prime = NO
