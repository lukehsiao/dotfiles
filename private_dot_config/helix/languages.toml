[language-server.rust-analyzer]
config = { procMacro = { ignored = { leptos_macro = [
	# Optional:
	# "component",
	"server"
] } } }

[language-server.tinymist]
command = "tinymist"

[language-server.typos]
command = "typos-lsp"
config.diagnosticSeverity = "Info"

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ty]
command = "ty"
args = ["server"]

[language-server.codebook]
command = "codebook-lsp"
args = ["serve"]

# valentjn/ltex-ls has been archived since 2023, so this is the maintained fork.
# Named for the binary it actually runs rather than aliased to the old name.
[language-server.ltex-ls-plus]
command = "ltex-ls-plus"

# Style linting (write-good, proselint, alex) from two configs with distinct
# jobs: ~/.vale.ini covers buffers outside any project, and
# ~/.config/vale/.vale.ini covers commit messages and mail, which sit inside
# a project whose own .vale.ini would otherwise leave them unmatched and so
# unchecked. Relies on vale being on $PATH and `vale sync` having been run,
# so installVale/syncOnStartup stay at their false defaults.
[language-server.vale-ls]
command = "vale-ls"

[[language]]
name = "email"
scope = "text.email"
roots = []
file-types = ["eml", "email"]
rulers = [72]
language-servers = [ "ltex-ls-plus", "typos", "codebook", "vale-ls" ]
text-width = 72

[[language]]
name = "markdown"
language-servers = [ "marksman", "ltex-ls-plus", "typos", "codebook", "vale-ls" ]
formatter = { command = "sed", args = ["s/[ \t]*$//"] }
auto-format = true

# Helix has no built-in mdx language, so reuse the markdown grammar for it.
[[language]]
name = "mdx"
scope = "source.mdx"
file-types = ["mdx"]
grammar = "markdown"
language-servers = [ "ltex-ls-plus", "typos", "codebook", "vale-ls" ]
formatter = { command = "sed", args = ["s/[ \t]*$//"] }
auto-format = true

[[language]]
name = "latex"
language-servers = [ "texlab", "ltex-ls-plus", "typos", "codebook" ]

[[language]]
name = "git-commit"
language-servers = [ "ltex-ls-plus", "typos", "codebook", "vale-ls" ]
formatter = { command = "sed", args = ["s/[ \t]*$//"] }
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "jjdescription"
language-servers = [ "typos", "codebook", "vale-ls" ]
formatter = { command = "sed", args = ["s/[ \t]*$//"] }
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "scss"
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "just"
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "rust"
language-servers = [ "rust-analyzer", "typos", "codebook" ]

[[language]]
name = "typst"
language-servers = [ "tinymist", "typos", "codebook" ]

[[language]]
name = "python"
rulers = [100]
text-width = 100
language-servers = [ "ty", "ruff", "typos", "codebook" ]
auto-format = true
