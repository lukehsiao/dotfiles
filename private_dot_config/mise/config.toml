wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }
# Dev tools that ship prebuilt binaries and release faster than distro
# packaging. Omarchy's own split is a pacman base plus mise for runtimes and
# vendor CLIs, so anything the desktop or another package depends on stays in
# pacman/brew. Shims are appended to PATH, not prepended, so a leftover system
# copy would shadow the mise one. A tool whose distro package shipped shell
# completions also needs a regenerating stub in fish/completions.
#
# Tools carrying an `os` restriction publish no linux/arm64 release assets.
# The restriction makes mise skip them on that platform instead of failing
# the whole `mise install`, which matters in devcontainers on Apple Silicon.
#
# mise keeps the coding agents current through `auto_update`. They release
# about once a day, and a new model can need a new client. mise's default
# 24h `minimum_release_age` hides each release for a day, so the agents set
# it to 0s. The 4h check interval matches Omarchy's agent declarations.
[tools]
atuin = "latest"
bottom = "latest"
choose = "latest"
claude = { version = "latest", auto_update = "4h", minimum_release_age = "0s" }
codex = { version = "latest", auto_update = "4h", minimum_release_age = "0s" }
croc = "latest"
d2 = "latest"
delta = "latest"
difftastic = "latest"
dprint = "latest"
duf = "latest"
gh = "latest"
"github:bensadeh/tailspin" = "latest"
"github:blopker/codebook" = "latest"
"github:bram209/leptosfmt" = { version = "latest", os = ["macos", "linux/x64"] }
"github:can1357/oh-my-pi" = { version = "latest", auto_update = "4h", minimum_release_age = "0s" }
"github:EmbarkStudios/cargo-deny" = "latest"
"github:github/git-sizer" = "latest"
"github:ifd3f/caligula" = "latest"
"github:latex-lsp/texlab" = "latest"
"github:leptos-rs/cargo-leptos" = "latest"
"github:ltex-plus/ltex-ls-plus" = "latest"
"github:lukehsiao/git-stats" = "latest"
"github:lukehsiao/openring-rs" = "latest"
"github:mfontanini/presenterm" = "latest"
"github:mstange/samply" = "latest"
"github:nextest-rs/nextest" = "latest"
"github:o2sh/onefetch" = "latest"
"github:obi1kenobi/cargo-semver-checks" = "latest"
"github:pagefind/pagefind" = "latest"
"github:pamburus/hl" = "latest"
"github:pdfcpu/pdfcpu" = "latest"
"github:RazrFalcon/svgcleaner" = { version = "latest", os = ["macos", "linux/x64"] }
"github:rustwasm/wasm-bindgen" = "latest"
"github:sharkdp/pastel" = "latest"
"github:taiki-e/cargo-llvm-cov" = "latest"
"github:tectonic-typesetting/tectonic" = "latest"
"github:tekumara/typos-lsp" = "latest"
"github:tummychow/git-absorb" = "latest"
"github:vale-cli/vale-ls" = "latest"
"github:wezm/git-grab" = { version = "latest", os = ["macos", "linux/x64"] }
glow = "latest"
gping = "latest"
helm = "latest"
hexyl = "latest"
hunk = "latest"
hyperfine = "latest"
jactionlint = "latest"
jaq = "latest"
jj = "latest"
jless = { version = "latest", os = ["macos", "linux/x64"] }
k9s = "latest"
kubectl = "latest"
lychee = "latest"
marksman = "latest"
mr-boxington = "latest"
oha = "latest"
oxipng = "latest"
pandoc = "latest"
ruff = "latest"
# mr_boxington makes mise run cargo through mbx. The `stable` channel keeps
# mise on the toolchain that `just _rustup` sets as default. That toolchain
# also gets the wasm target and rust-analyzer from `just _rust-core` and is
# updated by `rustup update`. A dated `latest` would need its own copies.
rust = { version = "stable", mr_boxington = true }
sd = "latest"
shellcheck = "latest"
shfmt = "latest"
tealdeer = "latest"
tinymist = "latest"
tombi = "latest"
ty = "latest"
typos = "latest"
typst = "latest"
vale = "latest"
watchexec = "latest"
xh = "latest"
zola = "latest"

[settings]
# mise exports RUSTUP_TOOLCHAIN, and rustup ranks it above a project's
# rust-toolchain.toml. Without this, the global `stable` overrides every
# pinned project. The global Cargo wrapper also runs these pinned
# toolchains through mbx.
idiomatic_version_file_enable_tools = ["rust"]

[settings.github]
credential_command = "head -n 1 ~/.github_token"
