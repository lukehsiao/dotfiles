MinAlertLevel = suggestion

# No StylesPath: vale defaults to the XDG data dir (~/.local/share/vale/
# styles) regardless of where the config file lives, and a literal home
# path would not port across machines.
Packages = write-good, proselint, alex

# This lives at ~/.vale.ini, NOT ~/.config/vale/.vale.ini, on purpose. It is
# the last stop of vale's normal upward config search, so any project with
# its own .vale.ini wins outright and this [*] never applies there. That
# matters because [*] makes vale lint every file it walks, which grinds on
# multi-MB images in a project's page bundles.
#
# Files with no project config land here: scratch notes, anything outside a
# repo, and jj descriptions (jj writes /tmp/editor-*.jjdescription). Buffers
# *inside* a project need ~/.config/vale/.vale.ini instead, since only the
# XDG config is force-merged into project runs; see the comment there.
[*]
BasedOnStyles = write-good, proselint, alex
# E-Prime flags every form of "to be", which is far too noisy for general prose.
write-good.E-Prime = NO
